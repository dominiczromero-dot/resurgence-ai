<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resurgence AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: a squad's tactical briefing screen: terse, confident, every number sourced.
   IDEA: the pre-match intel board: today's mission (#1 video) up top, recon below.
   PICTURE: the #1 recommendation card with its score dial and the real breakout thumbnails behind it.
   COLOUR and TYPE: gunmetal night, hot signal-orange for opportunity, blue = verified, grey = calculated, violet = prediction. Barlow Condensed headings, Barlow body.
   LAYOUT: sidebar nav, briefing column; stacks to a top nav row below 900px. */
:root{color-scheme:dark;--bg:#0c0e12;--panel:#141820;--panel2:#1a1f2a;--line:#262d3a;--ink:#e8ecf2;--mute:#8a95a8;--hot:#ff5a36;--hot2:#ff8a5c;--up:#3ddc84;--down:#7b8799;--v:#5ab0ff;--c:#b5bfcd;--p:#c4a2ff;--warn:#ffcc4d}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip}
a{color:var(--v);text-decoration:none}a:hover{text-decoration:underline}
h1,h2,h3{font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:700;letter-spacing:.01em;margin:0;line-height:1.1}
h1{font-size:clamp(28px,4vw,40px)}h2{font-size:22px}h3{font-size:18px}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
nav{background:#0a0c10;border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px}
.brand{white-space:nowrap;font:700 24px "Barlow Condensed",Barlow,sans-serif;padding:4px 10px 16px;display:flex;align-items:center;gap:8px}
.brand i{width:12px;height:12px;background:var(--hot);transform:rotate(45deg);display:inline-block}
nav a{color:var(--mute);padding:10px 12px;border-radius:8px;font-weight:600;display:block;min-height:40px}
nav a:hover{background:var(--panel);text-decoration:none;color:var(--ink)}
nav a.on{background:var(--panel2);color:var(--ink);box-shadow:inset 3px 0 0 var(--hot)}
nav .sp{flex:1}
main{padding:22px clamp(14px,3vw,36px) 60px;max-width:1320px;width:100%}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px}
.stamp{color:var(--mute);font-size:14px}.stamp b{color:var(--ink)}
.btn{background:var(--hot);color:#160803;border:0;border-radius:8px;padding:10px 16px;font:600 15px Barlow,system-ui,sans-serif;cursor:pointer;min-height:42px}
.btn:hover{background:var(--hot2)}.btn.ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}.btn.sm{padding:6px 10px;min-height:32px;font-size:13px}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,nav a:focus-visible{outline:2px solid var(--v);outline-offset:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
.grid{display:grid;gap:16px}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:5px;white-space:nowrap;vertical-align:middle}
.tv{background:rgba(90,176,255,.14);color:var(--v)}.tc{background:rgba(181,191,205,.12);color:var(--c)}.tp{background:rgba(196,162,255,.14);color:var(--p)}
.chip{display:inline-block;font-size:12.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.up{color:var(--up)}.down{color:var(--down)}.hot{color:var(--hot)}.warn{color:var(--warn)}.mute{color:var(--mute)}
.legend{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--mute);align-items:center}
.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:0;overflow:hidden;padding:0;border-color:#3a2a25;background:linear-gradient(135deg,#1c1512,#141820 60%)}
.hero .l{padding:24px}.hero .r{background:#0f1218;border-left:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:10px}
.kicker{color:var(--hot);font:700 15px "Barlow Condensed",Barlow,sans-serif;letter-spacing:.04em}
.bigtitle{font:700 clamp(24px,3.2vw,34px)/1.1 "Barlow Condensed",Barlow,sans-serif;margin:8px 0 12px}
.dial{display:flex;align-items:center;gap:14px;margin:14px 0}
.dial svg{width:84px;height:84px;flex:none}
.why{color:#c9d1dc;font-size:15px}
.vid{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.vid:first-child{border-top:0}
.vid img{width:120px;aspect-ratio:16/9;object-fit:cover;border-radius:6px;background:#222}
.vid .t{font-weight:600;font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vid .m{font-size:12.5px;color:var(--mute);margin-top:3px}
.bar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--hot);border-radius:4px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:9px 0;border-top:1px solid var(--line);align-items:center}
.row:first-of-type{border-top:0}
.row .bar{grid-column:1/-1}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.empty{text-align:left;padding:32px}.empty ol{color:#c9d1dc;padding-left:20px}.empty li{margin:6px 0}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mute);font-weight:600;font-size:12.5px}
td.n,th.n{text-align:right;white-space:nowrap}
.scroll{overflow-x:auto}
.idea{border-left:3px solid var(--line)}.idea.first{border-left-color:var(--hot)}
.idea .titles li{margin:4px 0}.idea details{margin-top:8px}
summary{cursor:pointer;color:var(--mute);font-weight:600}
.rk{border-top:1px solid var(--line);padding:6px 0;margin:0}.rk:first-of-type{border-top:0}.rk summary{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;color:var(--ink);min-height:44px}.rkn{font:700 18px "Barlow Condensed",Barlow,sans-serif;color:var(--mute)}.rkt{font-weight:600}
.idea ol{margin:6px 0 10px;padding-left:22px}
.shift{padding:8px 0;border-top:1px solid var(--line)}.shift:first-of-type{border-top:0}.shift s{color:var(--down)}.shift b{color:var(--up)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:12px 0}
.kv div{background:var(--panel2);border-radius:8px;padding:8px 10px}.kv b{display:block;font-size:17px}.kv span{font-size:12px;color:var(--mute)}
input,select,textarea{background:#0e1117;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:16px Barlow,system-ui,sans-serif;width:100%}
.inline input[type=checkbox],.check input{flex:none;width:18px;height:18px;padding:0}
textarea{font:14px/1.5 ui-monospace,Menlo,monospace;min-height:150px}
label{font-weight:600;font-size:14px;display:block;margin:12px 0 6px}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.inline input,.inline select{width:auto;flex:1 1 180px}
.check{display:flex;gap:8px;align-items:center;font-weight:500;margin:6px 0}.check input{width:18px;height:18px}
.note{font-size:13px;color:var(--mute)}
.banner{border:1px solid #5a4a1a;background:#221d0f;color:#f3e2a8;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:14px}
.banner.err{border-color:#5a2420;background:#24110f;color:#ffc4b8}
.fig{position:relative;min-height:320px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.overlay{position:fixed;inset:0;background:rgba(5,6,9,.8);display:none;place-items:center;z-index:9}
.overlay.on{display:grid}.overlay .panel{width:min(480px,92vw)}
.md h1{font-size:28px;margin:0 0 8px}.md h2{font-size:21px;margin:22px 0 8px}.md h3{font-size:17px;margin:14px 0 4px}.md blockquote{margin:10px 0;padding:8px 12px;border-left:3px solid var(--p);color:#c9d1dc;background:var(--panel2)}
.ch{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center}
.ch img{width:44px;height:44px;border-radius:50%;background:#222}
.view{display:none}.view.on{display:block}
.score{font:700 20px "Barlow Condensed",Barlow,sans-serif;white-space:nowrap}
@media(max-width:1100px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:900px){.app{grid-template-columns:1fr}nav{position:sticky;height:auto;flex-direction:row;overflow-x:auto;padding:8px;z-index:5;border-right:0;border-bottom:1px solid var(--line)}nav a{flex:none}.brand{padding:6px 10px;flex:none;white-space:nowrap}nav .sp{display:none}.hero{grid-template-columns:1fr}.hero .r{border-left:0;border-top:1px solid var(--line)}}
@media(max-width:640px){.g3,.g2{grid-template-columns:1fr}table{font-size:13px}.vid{grid-template-columns:96px minmax(0,1fr)}.vid img{width:96px}
.stack thead{display:none}.stack tr{display:grid;padding-block:8px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:7.5em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7em;margin-inline-start:-7.5em;color:var(--mute)}.stack td:empty{display:none}}
@media(prefers-reduced-motion:no-preference){.view.on{animation:in .25s ease}@keyframes in{from{opacity:0;transform:translateY(4px)}}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
<script src="core.js"></script>
</head>
<body>
<div class="app">
<nav id="nav">
  <div class="brand"><i></i>Resurgence AI</div>
  <a href="#today">Today</a>
  <a href="#ideas">Top 10 videos</a>
  <a href="#trends">Trends</a>
  <a href="#competitors">Competitors</a>
  <a href="#weapons">Weapons</a>
  <a href="#viral">Viral detector</a>
  <a href="#mine">My ideas</a>
  <a href="#titles">Title ranker</a>
  <a href="#history">Trend history</a>
  <a href="#report">Daily report</a>
  <div class="sp"></div>
  <a href="#settings">Settings & data</a>
</nav>
<main>
  <div class="top">
    <div>
      <div class="stamp" id="stamp">No research yet</div>
      <div class="legend" style="margin-top:6px"><span class="tag tv">Verified</span>YouTube API data <span class="tag tc">Calculated</span>math on verified data <span class="tag tp">Prediction</span>generated by Resurgence AI</div>
    </div>
    <div class="inline"><button class="btn" id="refresh">Run research now</button></div>
  </div>
  <div id="banners"></div>
  <section class="view" id="v-today"></section>
  <section class="view" id="v-ideas"></section>
  <section class="view" id="v-trends"></section>
  <section class="view" id="v-competitors"></section>
  <section class="view" id="v-weapons"></section>
  <section class="view" id="v-viral"></section>
  <section class="view" id="v-titles"></section>
  <section class="view" id="v-mine"></section>
  <section class="view" id="v-history"></section>
  <section class="view" id="v-report"></section>
  <section class="view" id="v-settings"></section>
</main>
</div>
<div class="overlay" id="overlay"><div class="panel"><h2>Researching YouTube…</h2><p id="prog" class="why">Starting</p><div class="bar"><i id="progbar" style="width:3%"></i></div><p class="note" id="progq"></p></div></div>

<script>
{
const C = window.ResurgenceCore;
const $ = s => document.querySelector(s);
const esc = C.esc, fmt = C.fmtNum, age = C.fmtAge;
const LS = {
  get(k, d) { try { const v = localStorage.getItem('rai.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('rai.' + k, JSON.stringify(v)); return true; } catch (e) { banner('Could not save to browser storage (' + e.message + '). Export your data from Settings.', true); return false; } }
};
let config = C.mergeConfig(LS.get('config', {}));
let research = LS.get('research', null);
let history = LS.get('history', []);
let A = null; // analysis
let ui = { viralWin: 168, viralMin: config.breakoutRatio, viralTracked: false, histKind: 'topics', histSel: null, openCh: null };

function apiKey() { return LS.get('key', ''); }
function saveConfig() { LS.set('config', config); }
function banner(msg, err) { const d = document.createElement('div'); d.className = 'banner' + (err ? ' err' : ''); d.innerHTML = msg; $('#banners').appendChild(d); }
function yt(id) { return 'https://www.youtube.com/watch?v=' + id; }
function chUrl(id) { return 'https://www.youtube.com/channel/' + id; }
const tzName = () => config.timeZone || Intl.DateTimeFormat().resolvedOptions().timeZone;
function when(iso) { return new Date(iso).toLocaleString('en-US', { timeZone: tzName(), weekday: 'short', month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit', timeZoneName: 'short' }); }
const momCls = l => l === 'Rising' ? 'up' : l === 'Cooling' || l === 'Quiet' ? 'down' : '';
const verdictCls = v => v.startsWith('Upload today') ? 'up' : v.startsWith('Avoid') ? 'hot' : v.startsWith('Upload in') ? 'warn' : 'mute';
const ratioTxt = v => v.ratio == null ? '<span class="mute">no baseline</span>' : `<b class="${v.ratio >= A.cfg.breakoutRatio ? 'hot' : ''}">${v.ratio.toFixed(1)}×</b>`;

function vidRow(v, extra = '') {
  return `<div class="vid"><a href="${yt(v.id)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(v.thumb || '')}" alt=""></a>
  <div><a class="t" href="${yt(v.id)}" target="_blank" rel="noopener">${esc(v.title)}</a>
  <div class="m">${esc(v.channelTitle)} · <span title="Verified">${fmt(v.views)} views</span> · ${age(v.ageHours)} ago · ${fmt(v.vph)}/h${v.recentVph != null ? ` (now ${fmt(v.recentVph)}/h)` : ''} · ${ratioTxt(v)} norm${v.lowConfidence ? ' <span class="warn" title="Under 6h old or baseline is a lifetime-average proxy">low conf.</span>' : ''}</div>${extra}</div></div>`;
}
function dial(score) {
  const r = 34, c = 2 * Math.PI * r, col = score >= 65 ? 'var(--hot)' : score >= 50 ? 'var(--warn)' : 'var(--down)';
  return `<svg viewBox="0 0 84 84" aria-label="Opportunity score ${score} of 100"><circle cx="42" cy="42" r="${r}" fill="none" stroke="#262d3a" stroke-width="8"/><circle cx="42" cy="42" r="${r}" fill="none" stroke="${col}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c * score / 100} ${c}" transform="rotate(-90 42 42)"/><text x="42" y="48" text-anchor="middle" fill="#e8ecf2" font-family="Barlow Condensed" font-weight="700" font-size="24">${score}</text></svg>`;
}
function compTable(comp) { return `<table><tbody>${comp.map(p => `<tr><td>${esc(p.k)}</td><td class="n"><b>${p.pts}</b>/${p.max}</td><td class="mute">${esc(p.why)}</td></tr>`).join('')}</tbody></table>`; }

function emptyState(where) {
  const hasKey = !!apiKey();
  return `<div class="panel empty"><h2>${where ? esc(where) + ': no' : 'No'} verified research yet</h2>
  <p class="why">Resurgence AI only shows real YouTube data. Nothing here is sample or demo data, so this stays empty until research runs.</p>
  <ol><li>${hasKey ? '<span class="up">✓</span> YouTube API key saved' : '<a href="#settings">Add your YouTube Data API v3 key</a> (free, ~5 minutes; steps in README.md)'}</li>
  <li>Check your tracked channels in <a href="#competitors">Competitors</a>. They resolve to real channel IDs on the first run.</li>
  <li>Press <b>Run research now</b>. One run uses about 1,000–1,600 of your 10,000 free daily quota units.</li>
  <li>For automatic morning reports, set up <code>scripts/daily-research.mjs</code> (see README).</li></ol></div>`;
}

// ---------------- TODAY ----------------
function rToday() {
  const el = $('#v-today');
  if (!A) { el.innerHTML = emptyState(''); return; }
  const top = A.ideas[0];
  const ideaHtml = top ? `<div class="panel hero">
    <div class="l"><div class="kicker">THE #1 VIDEO TO MAKE RIGHT NOW <span class="tag tp">Prediction</span></div>
      <div class="bigtitle">${esc(top.titles[0]?.title || top.idea)}</div>
      <div class="why">${esc(top.idea)}</div>
      ${top.verdict !== 'Upload today' ? '<p class="note warn">No idea clears the “upload today” bar in this research. This is the strongest option available; the verdict says how urgent it is.</p>' : ''}
      <div class="dial">${dial(top.score)}<div><div class="score ${verdictCls(top.verdict)}">${esc(top.verdict)}</div><div class="note">Opportunity ${top.score}/100 · competition ${top.competition} · momentum <span class="${momCls(top.momentum)}">${top.momentum}</span> · data confidence ${top.confidence}</div></div></div>
      <p class="why"><span class="tag tc">Calculated</span> ${esc(top.why)}</p>
      <p class="why"><b>Thumbnail:</b> ${esc(top.thumbnail)}</p>
      <p class="note">Alt titles: ${top.titles.slice(1).map(t => esc(t.title)).join(' · ')}</p>
      <a class="btn ghost sm" href="#ideas">See all 10 ideas and score breakdowns</a></div>
    <div class="r"><div class="sec-h"><h3>Evidence</h3><span class="tag tv">Verified</span></div>${top.support.map(id => A.byId[id]).filter(Boolean).slice(0, 4).map(v => vidRow(v)).join('')}</div>
  </div>` : `<div class="panel"><h2>Not enough data for a recommendation</h2><p class="why">Research ran but no topic had 2+ recent videos or a breakout. Try adding more search queries or tracked channels in Settings.</p></div>`;
  const topics = A.topics.filter(t => t.n7 && !t.umbrella).slice(0, 6), maxH = Math.max(...topics.map(t => t.heat), 1);
  el.innerHTML = `<h1 style="margin-bottom:6px">Here's what's trending today</h1>
  <p class="mute" style="margin:0 0 16px">Based on ${A.counts.recent} long-form Warzone videos from the last 7 days across ${A.counts.channels} channels.</p>
  ${ideaHtml}
  <div class="grid g3" style="margin-top:16px">
    <div class="panel"><div class="sec-h"><h3>Today's trends</h3><span class="tag tc">Calculated</span></div>
      ${topics.map(t => `<div class="row"><div><b>${esc(t.label)}</b> <span class="note">${t.n48} uploads / 48h · ${t.ch48} ch</span></div><span class="chip ${momCls(t.momentumLabel)}">${t.momentumLabel} ${t.momentum}×</span><div class="bar"><i style="width:${(t.heat / maxH * 100).toFixed(0)}%"></i></div></div>`).join('')}
      <a class="note" href="#trends">All topics →</a></div>
    <div class="panel"><div class="sec-h"><h3>Creators gaining views</h3><span class="tag tc">Calculated</span></div>
      ${A.creators.slice(0, 6).map(c => `<div class="row"><div><a href="${chUrl(c.id)}" target="_blank" rel="noopener"><b>${esc(c.title)}</b></a>${c.tracked ? ' <span class="chip">tracked</span>' : ''}<div class="note">${c.uploads7} uploads · ${fmt(c.views7)} views this week</div></div><span class="score">${c.medianRatio.toFixed(1)}×</span></div>`).join('') || '<p class="mute">No creators with baselines yet.</p>'}
      <p class="note">× = median of this week's uploads vs that creator's own age-adjusted norm.</p></div>
    <div class="panel"><div class="sec-h"><h3>Blowing up right now</h3><span class="tag tv">Verified</span></div>
      ${A.breakouts.slice(0, 4).map(v => vidRow(v)).join('') || `<p class="mute">No video is above ${A.cfg.breakoutRatio}× its channel norm this week.</p>`}
      <a class="note" href="#viral">Viral detector →</a></div>
  </div>
  <div class="grid g3" style="margin-top:16px">
    <div class="panel"><div class="sec-h"><h3>Meta shifts</h3><span class="tag tv">Verified titles</span></div>
      ${A.shifts.slice(0, 5).map(s => `<div class="shift"><s>${esc(s.from)}</s> → <b>${esc(s.to)}</b> <span class="note">${esc(A.byId[s.video].channelTitle)} · ${C.fmtAge(s.ageHours)} ago</span></div>`).join('') || '<p class="mute">No “Goodbye X, Hello Y” videos in the last 3 weeks.</p>'}
      <p class="note">Creators announce meta changes in their titles. The weapon on the right is replacing the one on the left.</p></div>
    <div class="panel"><div class="sec-h"><h3>Also worth recording</h3><span class="tag tp">Prediction</span></div>
      ${A.ideas.slice(1, 3).map(i => `<div class="row"><div><b>#${i.rank} ${esc(i.titles[0]?.title || i.idea)}</b><div class="note">${esc(i.idea)}</div></div><div style="text-align:right"><div class="score">${i.score}</div><div class="note ${verdictCls(i.verdict)}">${esc(i.verdict)}</div></div></div>`).join('') || '<p class="mute">Not enough data.</p>'}</div>
    <div class="panel"><div class="sec-h"><h3>Avoid</h3><span class="tag tc">Calculated</span></div>
      ${A.avoid.map(t => `<div class="row"><div><b>${esc(t.label)}</b><div class="note">${esc(t.why)}</div></div><span class="chip hot">Avoid</span></div>`).join('') || `<p class="mute">Nothing is saturated right now (threshold: ${A.cfg.saturationChannels} channels in 48h with flat momentum).</p>`}</div>
  </div>`;
}

// ---------------- IDEAS ----------------
function rIdeas() {
  const el = $('#v-ideas');
  if (!A) { el.innerHTML = emptyState('Top 10 videos'); return; }
  el.innerHTML = `<div class="sec-h"><h1>Top 10 videos to make</h1><span class="tag tp">Prediction</span></div>

  <div class="panel scroll" style="margin-top:16px"><table class="stack"><thead><tr><th>Topic</th><th class="n">Heat</th><th class="n">24h</th><th class="n">48h</th><th class="n">7d</th><th class="n">Channels 48h</th><th>Momentum</th><th>Competition</th><th class="n">Breakouts</th><th>History phase</th></tr></thead><tbody>

  </tbody></table>
  <p class="note">Heat = sum of each video's breakout ratio (capped at 10×), weighted toward the last 3 days. Momentum = how strongly the last 48h of uploads beat their own channels' norms, compared with uploads from 2–7 days ago (above 1.25× = rising). Counts are long-form videos found by your search queries and tracked channels, not all of YouTube.</p></div>
  <div class="grid g2" style="margin-top:16px">${A.topics.filter(t => t.n7).slice(0, 6).map(t => `<div class="panel"><div class="sec-h"><h3>${esc(t.label)}</h3><span class="tag tv">Verified</span></div>${t.top.slice(0, 3).map(id => A.byId[id]).filter(Boolean).map(v => vidRow(v)).join('')}</div>`).join('')}</div>`;
  $('#fShorts').onchange = e => { config.includeShorts = e.target.checked; saveConfig(); recompute(); };
  $('#fRes').onchange = e => { config.resurgenceOnly = e.target.checked; saveConfig(); recompute(); };
  const s = $('#map svg');
  const pts = A.topics.filter(t => t.n7);
  const draw = () => {
    const W = s.clientWidth, H = s.clientHeight, pad = 44;
    if (!W) return;
    const maxM = Math.max(2, ...pts.map(p => p.momentum)), maxC = Math.max(A.cfg.saturationChannels, ...pts.map(p => p.ch48)), maxH = Math.max(...pts.map(p => p.heat), 1);
    const x = m => pad + (Math.min(m, maxM) / maxM) * (W - pad * 2), y = c => pad / 2 + (c / maxC) * (H - pad * 1.5);
    let g = `<rect x="${x(1)}" y="${pad / 2}" width="${W - pad - x(1)}" height="${(H - pad * 1.5) / 2}" fill="rgba(61,220,132,.06)"/>`;
    g += `<line x1="${x(1)}" x2="${x(1)}" y1="${pad / 2}" y2="${H - pad}" stroke="#394355" stroke-dasharray="4 4"/>`;
    g += `<text x="${x(1) + 4}" y="${H - pad + 16}" fill="#8a95a8" font-size="12">1.0× steady</text><text x="${W - pad}" y="${H - pad + 16}" fill="#8a95a8" font-size="12" text-anchor="end">rising →</text>`;
    g += `<text x="6" y="${pad / 2 + 10}" fill="#8a95a8" font-size="12">few channels</text><text x="6" y="${H - pad}" fill="#8a95a8" font-size="12">crowded</text>`;
    const small = W < 520, placed = [];
    pts.forEach(p => { const r = 6 + 16 * Math.sqrt(p.heat / maxH), cx = x(p.momentum), cy = y(p.ch48);
      g += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${p.momentumLabel === 'Rising' ? 'rgba(255,90,54,.55)' : 'rgba(138,149,168,.35)'}" stroke="${p.momentumLabel === 'Rising' ? '#ff5a36' : '#8a95a8'}"><title>${esc(p.label)}: momentum ${p.momentum}×, ${p.ch48} channels/48h, heat ${p.heat}</title></circle>`;
      const txt = small ? p.label.split(' ')[0] : p.label, tw = txt.length * 6.6;
      let lx = cx + r + 4; if (lx + tw > W - 4) lx = cx - r - 4 - tw;
      let ly = cy + 4;
      for (const off of [0, 14, -14, 28, -28, 42, -42]) { const yy = cy + 4 + off; if (!placed.some(b => Math.abs(b.y - yy) < 13 && lx < b.x + b.w && lx + tw > b.x)) { ly = yy; break; } }
      placed.push({ x: lx, y: ly, w: tw });
      g += `<text x="${lx}" y="${ly}" fill="#e8ecf2" font-size="12">${esc(txt)}</text>`; });
    s.innerHTML = g;
  };
  new ResizeObserver(draw).observe(s); draw();
}

// ---------------- COMPETITORS ----------------
function patternsFor(vs) {
  const good = vs.filter(v => v.ratio != null && v.ratio >= 1.5);
  const cnt = (arr) => { const m = {}; arr.forEach(x => m[x] = (m[x] || 0) + 1); return Object.entries(m).sort((a, b) => b[1] - a[1]).slice(0, 4); };
  const topics = cnt(good.flatMap(v => v.topics)).map(([k, n]) => C.TOPIC_BY_ID[k].label + ' ×' + n);
  const weapons = cnt(good.flatMap(v => v.weapons)).map(([k, n]) => k + ' ×' + n);
  const caps = cnt(good.flatMap(v => v.title.split(/\s+/).filter(w => /^[A-Z]{3,}$/.test(w.replace(/[^A-Z]/g, '')) && w.replace(/[^A-Z]/g, '').length >= 3).map(w => w.replace(/[^A-Z]/g, '')))).map(([k, n]) => k + ' ×' + n);
  const kills = good.filter(v => v.kills).length;
  return { n: good.length, topics, weapons, caps, kills };
}

      <div><b style="font-size:17px">${ch ? `<a href="${chUrl(c.id)}" target="_blank" rel="noopener">${esc(ch.title)}</a>` : esc(c.input)}</b> <span class="chip ${st === 'verified' ? 'up' : /weak|not|error/.test(st) ? 'hot' : 'warn'}">${esc(st)}</span>

  $('#addBtn').onclick = add; $('#addCh').onkeydown = e => { if (e.key === 'Enter') add(); };
  el.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { config.competitors.splice(+b.dataset.rm, 1); saveConfig(); rCompetitors(); });
  el.querySelectorAll('[data-confirm]').forEach(b => b.onclick = () => { config.competitors[+b.dataset.confirm].status = 'verified'; saveConfig(); rCompetitors(); });
  el.querySelectorAll('[data-wrong]').forEach(b => b.onclick = () => { const c = config.competitors[+b.dataset.wrong]; delete c.id; c.status = 'rejected: paste their @handle or channel URL'; saveConfig(); rCompetitors(); });
  el.querySelectorAll('[data-open]').forEach(b => b.onclick = () => { ui.openCh = ui.openCh === b.dataset.open ? null : b.dataset.open; rCompetitors(); });
  el.querySelectorAll('[data-track]').forEach(b => b.onclick = () => { config.competitors.push({ input: b.dataset.name, id: b.dataset.track, status: 'verified', matchedBy: 'suggested from research' }); saveConfig(); rCompetitors(); });

// ---------------- HISTORY ----------------
function rHistory() {
  const el = $('#v-history');
  const snaps = [...history].sort((a, b) => Date.parse(a.at) - Date.parse(b.at));
  const kind = ui.histKind;
  const keys = kind === 'topics' ? C.TOPICS.map(t => t.id) : [...new Set(snaps.flatMap(s => Object.keys(s.weapons || {})))];
  const label = k => kind === 'topics' ? C.TOPIC_BY_ID[k].label : k;
  const last = snaps[snaps.length - 1] || {};
  const ranked = keys.map(k => ({ k, v: (last[kind] || {})[k] || 0 })).sort((a, b) => b.v - a.v);
  if (!ui.histSel || !ui.histSel.every(k => keys.includes(k))) ui.histSel = ranked.slice(0, 4).map(r => r.k);
  const phases = keys.map(k => { const series = snaps.map(s => (s[kind] || {})[k] || 0); return { k, series, ...phaseOf(series) }; }).filter(p => p.series.some(x => x > 0)).sort((a, b) => b.series[b.series.length - 1] - a.series[a.series.length - 1]);
  el.innerHTML = `<div class="sec-h"><h1>Trend history</h1><span class="tag tc">Calculated</span></div>
  <p class="mute">${snaps.length} daily snapshot(s) stored${snaps.length ? `, ${esc(snaps[0].date)} → ${esc(last.date)}` : ''}. Rising/peaking/declining needs at least 3 days. Snapshots are saved automatically each time research runs (once per day is kept).</p>
  <div class="panel"><div class="inline" style="margin-bottom:8px"><select id="hk" style="flex:0 1 160px"><option value="topics">Topics</option><option value="weapons">Weapons</option></select>
  ${ranked.slice(0, 12).map(r => `<label class="check" style="margin-right:8px"><input type="checkbox" data-hs="${esc(r.k)}" ${ui.histSel.includes(r.k) ? 'checked' : ''}> ${esc(label(r.k))}</label>`).join('')}</div>
  <div class="fig" id="hfig"><svg></svg></div></div>
  <div class="panel scroll" style="margin-top:16px"><table class="stack"><thead><tr><th>${kind === 'topics' ? 'Topic' : 'Weapon'}</th><th>Phase</th><th class="n">Latest heat</th><th class="n">Previous</th><th class="n">Peak</th></tr></thead><tbody>
  ${phases.map(p => `<tr><td><b>${esc(label(p.k))}</b></td><td class="${p.code === 'up' ? 'up' : p.code === 'down' ? 'down' : p.code === 'peak' ? 'warn' : 'mute'}">${esc(p.phase)}</td><td class="n">${p.series[p.series.length - 1]}</td><td class="n">${p.series.length > 1 ? p.series[p.series.length - 2] : '–'}</td><td class="n">${Math.max(...p.series)}</td></tr>`).join('') || '<tr><td colspan="5" class="mute">No history yet.</td></tr>'}</tbody></table></div>`;
  $('#hk').value = kind;
  $('#hk').onchange = e => { ui.histKind = e.target.value; ui.histSel = null; rHistory(); };
  el.querySelectorAll('[data-hs]').forEach(b => b.onchange = () => { const k = b.dataset.hs; ui.histSel = b.checked ? [...ui.histSel, k] : ui.histSel.filter(x => x !== k); rHistory(); });
  const s = $('#hfig svg'), cols = ['#ff5a36', '#5ab0ff', '#3ddc84', '#ffcc4d', '#c4a2ff', '#ff8fb1', '#7fe0e0', '#d0d6df'];
  const draw = () => {
    const W = s.clientWidth, H = s.clientHeight; if (!W) return;
    if (snaps.length < 2) { s.innerHTML = `<text x="${W / 2}" y="${H / 2}" text-anchor="middle" fill="#8a95a8" font-size="14">The chart appears after 2 days of snapshots.</text>`; return; }
    const pl = 40, pr = 16, pt = 14, pb = 30;
    const series = ui.histSel.map(k => snaps.map(sn => (sn[kind] || {})[k] || 0));
    const maxY = Math.max(1, ...series.flat());
    const x = i => pl + i * (W - pl - pr) / (snaps.length - 1), y = v => pt + (1 - v / maxY) * (H - pt - pb);
    let g = '';
    for (let i = 0; i <= 4; i++) { const v = maxY * i / 4; g += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="#20262f"/><text x="${pl - 6}" y="${y(v) + 4}" fill="#8a95a8" font-size="11" text-anchor="end">${v.toFixed(0)}</text>`; }
    const step = Math.ceil(snaps.length / (W < 520 ? 4 : 8));
    snaps.forEach((sn, i) => { if (i % step === 0 || i === snaps.length - 1) g += `<text x="${x(i)}" y="${H - 8}" fill="#8a95a8" font-size="11" text-anchor="middle">${esc(sn.date.slice(5))}</text>`; });
    series.forEach((ser, j) => { const c = cols[j % cols.length]; g += `<polyline fill="none" stroke="${c}" stroke-width="2.5" points="${ser.map((v, i) => x(i) + ',' + y(v)).join(' ')}"/>`; ser.forEach((v, i) => g += `<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="${c}"><title>${esc(label(ui.histSel[j]))} ${esc(snaps[i].date)}: ${v}</title></circle>`); g += `<text x="${W - pr}" y="${pt + 14 + j * 16}" fill="${c}" font-size="12" text-anchor="end">${esc(label(ui.histSel[j]))}</text>`; });
    s.innerHTML = g;
  };
  new ResizeObserver(draw).observe(s); draw();
}
function phaseOf(series) {
  if (series.length < 3) return { phase: 'Needs 3+ days', code: 'na' };
  const l = series[series.length - 1], p = series[series.length - 2], p2 = series[series.length - 3], mx = Math.max(...series);
  if (l >= p * 1.15) return { phase: 'Rising', code: 'up' };
  if (l <= p * 0.85) return { phase: series.slice(-4).includes(mx) ? 'Peaked, now declining' : 'Declining', code: 'down' };
  if (l >= 0.9 * mx && p >= p2 * 1.1) return { phase: 'Peaking', code: 'peak' };
  return { phase: 'Flat', code: 'flat' };
}

// ---------------- REPORT ----------------
function md2html(md) {
  return md.split('\n').map(line => {
    let l = esc(line).replace(/\[([^\]]+)\]\((https:\/\/www\.youtube\.com\/watch\?v=[\w-]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/(^|\s)_([^_]+)_(\s|$)/g, '$1<i>$2</i>$3');
    if (l.startsWith('### ')) return `<h3>${l.slice(4)}</h3>`;
    if (l.startsWith('## ')) return `<h2>${l.slice(3)}</h2>`;
    if (l.startsWith('# ')) return `<h1>${l.slice(2)}</h1>`;
    if (l.startsWith('&gt; ')) return `<blockquote>${l.slice(5)}</blockquote>`;
    if (l.startsWith('- ')) return `<div style="margin:4px 0 4px 14px">• ${l.slice(2)}</div>`;
    return l ? `<p style="margin:6px 0">${l}</p>` : '';
  }).join('');
}

// ---------------- RUN ----------------
async function runResearch() {
  const key = apiKey();
  if (!key) { location.hash = '#settings'; banner('Add your YouTube Data API key first. Research needs it.', true); return; }
  if (location.protocol === 'file:') { /* fetch to googleapis works from file:// in Chrome/Edge/Firefox */ }
  $('#overlay').classList.add('on'); $('#banners').innerHTML = '';
  let n = 0;
  try {
    const r = await C.research({ apiKey: key, config, onProgress: p => { n++; $('#prog').textContent = p.msg; $('#progq').textContent = p.quota + ' quota units used'; $('#progbar').style.width = Math.min(97, 3 + n * 4) + '%'; } });
    config.competitors = r.competitors.map(c => {
      const prev = config.competitors.find(x => x.input === c.input) || {};
      const status = prev.id && prev.id === c.id && prev.status ? prev.status : (c.status || (c.id ? 'verified' : 'not found'));
      return { input: c.input, id: c.id, status, matchedBy: c.matchedBy || prev.matchedBy };
    });
    saveConfig();
    research = r; LS.set('research', r);
    const a = C.analyze(r, config, history);
    history = C.addSnapshot(history, C.snapshot(r, a)); LS.set('history', history);
    if (r.errors.length) banner('<b>Research finished with ' + r.errors.length + ' problem(s):</b><br>' + r.errors.slice(0, 6).map(esc).join('<br>') + (r.errors.some(e => /quota/i.test(e)) ? '<br>Daily quota hit: results are partial. Quota resets at midnight Pacific.' : ''), true);
  } catch (e) {
    banner('<b>Research failed:</b> ' + esc(e.message) + (e.reason === 'quotaExceeded' ? ' (daily quota used up; resets at midnight Pacific)' : e.reason === 'keyInvalid' || /API key/i.test(e.message) ? ' (check the key in Settings)' : '') + '. Nothing was saved, so the dashboard still shows the last successful research.', true);
  } finally { $('#overlay').classList.remove('on'); recompute(); }
}
$('#refresh').onclick = runResearch;

function recompute() {
  if (research && research.competitors) for (const c of config.competitors) if (!c.id) { const r = research.competitors.find(x => x.input === c.input && x.id); if (r) { c.id = r.id; c.status = c.status || r.status || 'verified'; c.matchedBy = r.matchedBy; } }
  A = research ? C.analyze(research, config, history.filter(s => s.at !== research.researchedAt)) : null;
  $('#stamp').innerHTML = research ? `Latest research: <b>${esc(when(research.researchedAt))}</b> · ${A.counts.recent} recent long-form videos · ${research.quotaUsed} quota units <span class="tag tv">Verified</span>` : 'No research yet: <a href="#settings">add your API key</a>, then run research';
  if (research) {
    const ageH = (Date.now() - Date.parse(research.researchedAt)) / 36e5;
    if (ageH > 26 && !$('#stale')) banner(`<span id="stale">This research is ${Math.round(ageH)} hours old. Run research or check your daily automation before trusting “today”.</span>`);
  }
  route();
}
const views = { today: rToday, ideas: rIdeas, trends: rTrends, competitors: rCompetitors, weapons: rWeapons, viral: rViral, titles: rTitles, mine: rMine, history: rHistory, report: rReport, settings: rSettings };
function route() {
  const v = (location.hash || '#today').slice(1);
  const name = views[v] ? v : 'today';
  document.querySelectorAll('.view').forEach(s => s.classList.toggle('on', s.id === 'v-' + name));
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + name));
  views[name]();
}
window.addEventListener('hashchange', route);

// When served over http (npm start / GitHub Pages), pick up the daily script's output automatically.
async function loadServed() {
  if (!/^https?:/.test(location.protocol)) return;
  try {
    if (LS.get('config', null) == null) { const c = await fetch('config.json', { cache: 'no-store' }); if (c.ok) config = C.mergeConfig(await c.json()); }
    const [l, h] = await Promise.all([fetch('data/latest.json', { cache: 'no-store' }), fetch('data/history.json', { cache: 'no-store' })]);
    if (h.ok) { history = mergeHistory(history, await h.json()); LS.set('history', history); }
    if (l.ok) { const j = await l.json(); if (!research || j.researchedAt > research.researchedAt) { research = j; LS.set('research', j); } }
  } catch (e) { /* no served data: fine */ }
}
loadServed().finally(recompute);
}
</script>
