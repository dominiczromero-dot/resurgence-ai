name: Daily Resurgence research

on:
  schedule:
    - cron: '7 13 * * *'   # 13:07 UTC = 5:07 AM Pacific (PST) / 6:07 AM (PDT)
  workflow_dispatch: {}     # "Run workflow" button for a manual refresh

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run research
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          REPORT_TZ: America/Los_Angeles
        run: node scripts/daily-research.mjs
      - name: Commit results
        run: |
          git config user.name "resurgence-ai-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data reports config.json
          git diff --cached --quiet || git commit -m "Daily research $(date -u +%F)"
          git push
